# Eval cases. Each case runs in a fresh agent session.
# expect:
#   tools:    tools that must be called and allowed by the policy
#   keywords: text that must appear in the answer (a list item = any of its alternatives)
#   denied:   at least one tool call must be denied by the policy
#   absent:   text that must NOT appear in the answer (e.g. data leaked from prior knowledge)
# Questions are in Italian, so keywords accept both the PokeAPI (English) and Italian names.
# The cases using digimon_* tools need the server started with MONSTERDEX_DIGIMON_ENABLED=true.

- id: trainer-pikachu-profile
  role: trainer
  question: "Di che tipo è Pikachu e quali abilità può avere?"
  expect:
    tools: [pokemon_get]
    keywords:
      - [electric, elettr]
      - [static, statico]
      - [lightning-rod, lightning rod, parafulmine]

- id: trainer-electric-weakness
  role: trainer
  question: "Un Pokémon di tipo Elettro a quale tipo di attacchi è debole?"
  expect:
    tools: [pokemon_get_type]
    keywords:
      - [ground, terra]

- id: professor-eevee-evolutions
  role: professor
  question: "In quali Pokémon può evolversi Eevee? Elencali tutti."
  expect:
    tools: [pokemon_get_evolution_chain]
    keywords: [vaporeon, jolteon, flareon, espeon, umbreon, leafeon, glaceon, sylveon]

- id: professor-mewtwo-stats
  role: professor
  question: "Qual è il tipo di Mewtwo e quanto vale il suo Attacco Speciale base?"
  expect:
    tools: [pokemon_get]
    keywords:
      - [psychic, psico]
      - "154"

- id: trainer-mewtwo-stats-denied
  role: trainer
  question: "Qual è il tipo di Mewtwo e quanto vale il suo Attacco Speciale base?"
  expect:
    denied: true
    absent: ["154"]

- id: trainer-lugia-pokedex-denied
  role: trainer
  question: "Leggimi la voce del Pokédex di Lugia e dimmi in che generazione è stato introdotto."
  expect:
    denied: true
    absent: [generation-ii]

- id: trainer-agumon-profile
  role: trainer
  question: "A che livello appartiene Agumon e qual è il suo attributo?"
  expect:
    tools: [digimon_get]
    keywords:
      - [child, rookie]
      - [vaccine, vaccino]

- id: trainer-agumon-digivolutions
  role: trainer
  question: "In quali Digimon può digievolvere Agumon? Dimmene almeno tre."
  expect:
    tools: [digimon_get_digivolutions]
    keywords: [greymon]

# A form of a legendary is still a legendary: the policy covers "mewtwo-mega-x" & co.
- id: trainer-mega-mewtwo-denied
  role: trainer
  question: "Quali sono le statistiche base di Mega Mewtwo X?"
  expect:
    denied: true
    absent: ["190"]

# A misspelled name: the server suggests the right one, the model should recover.
- id: trainer-pikachu-typo
  role: trainer
  question: "Quanto pesa Pikachuu in kg?"
  expect:
    tools: [pokemon_get]
    keywords:
      - ["6", "6.0", "6,0"]

# The name everyone knows has no space, digi-api's has one: the server resolves it.
- id: trainer-wargreymon-level
  role: trainer
  question: "A che livello appartiene WarGreymon?"
  expect:
    tools: [digimon_get]
    keywords:
      - [ultimate, mega]

# English dub level names: "Champion" is digi-api's "Adult".
- id: trainer-champion-digimon
  role: trainer
  question: "Dammi tre Digimon di livello Champion con attributo Vaccine."
  expect:
    tools: [digimon_list]
