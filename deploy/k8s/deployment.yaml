# Pokédex MCP on Kubernetes. Apply with: kubectl apply -f deploy/k8s/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monsterdex-mcp
  labels:
    app.kubernetes.io/name: monsterdex-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: monsterdex-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # a new pod must be ready before an old one starts draining
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monsterdex-mcp
    spec:
      # Must exceed MONSTERDEX_SHUTDOWN_DRAIN_SECONDS + MONSTERDEX_SHUTDOWN_TIMEOUT_SECONDS + flush.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # the image's `app` user (fixed in the Dockerfile)
        runAsGroup: 10001
        fsGroup: 10001  # mounted Secrets become readable by the app group
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monsterdex-mcp
          image: monsterdex-mcp:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MONSTERDEX_ALLOWED_HOSTS  # Host headers accepted by /mcp (the Service name)
              value: "monsterdex-mcp:*,monsterdex-mcp.default.svc.cluster.local:*"
            - name: MONSTERDEX_SHUTDOWN_DRAIN_SECONDS
              value: "5"
            - name: MONSTERDEX_SHUTDOWN_TIMEOUT_SECONDS
              value: "20"
            - name: MONSTERDEX_TELEMETRY_ENABLED
              value: "false"
            # Who may call /mcp: token hashes, client ids, scopes (see the README, "Inbound
            # authentication"). Without the Secret every request gets 401 (fail closed).
            - name: MONSTERDEX_AUTH_CLIENTS_FILE
              value: /var/run/secrets/mcp-clients/clients
            # Digimon catalog. Once enabled, /readyz also requires the token file to exist.
            - name: MONSTERDEX_DIGIMON_ENABLED
              value: "false"
            - name: MONSTERDEX_DIGIMON_TOKEN_FILE
              value: /var/run/secrets/digimon/token
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: "http://otel-collector.observability:4318"
          # Startup: allow up to 30 s to boot before liveness starts counting.
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 2
            failureThreshold: 15
          # Liveness: restart only if the process stops answering. Never depends on PokeAPI.
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: in rotation only when started and not draining.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 1
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp  # the root filesystem is read-only; Python and httpx may need a temp dir
              mountPath: /tmp
            - name: mcp-clients  # no subPath: rotation must reach the file
              mountPath: /var/run/secrets/mcp-clients
              readOnly: true
            - name: digimon-token  # no subPath: Kubernetes would never update the file
              mountPath: /var/run/secrets/digimon
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: mcp-clients
          secret:
            secretName: monsterdex-mcp-clients  # key "clients"
            defaultMode: 0440
            optional: true  # the pod starts; /readyz reports auth.clients_file as degraded
        - name: digimon-token
          secret:
            secretName: digimon-api-token  # key "token"
            defaultMode: 0440  # root + the fsGroup may read; nobody else
            optional: true  # the pod starts without it while the catalog is off
---
apiVersion: v1
kind: Service
metadata:
  name: monsterdex-mcp
  labels:
    app.kubernetes.io/name: monsterdex-mcp
spec:
  selector:
    app.kubernetes.io/name: monsterdex-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
