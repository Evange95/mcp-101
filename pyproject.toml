[project]
name = "pokedex-mcp"
version = "0.1.0"
description = "MCP server exposing PokeAPI Pokédex data, hosted in FastAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.2,<3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
pokedex-mcp = "pokedex_mcp.main:run"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: hits the real PokeAPI (deselected by default, run with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py314"
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = ["N818"]  # domain exception names (NotFound, InvalidQuery) are intentional

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]
