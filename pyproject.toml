[project]
name = "monsterdex-mcp"
version = "0.1.0"
description = "MCP server exposing PokeAPI Pokédex data, hosted in FastAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
monsterdex-mcp = "pokedex_mcp.main:run"
monsterdex-token = "pokedex_mcp.platform.inbound.auth:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is monsterdex-mcp; the import package keeps its original name.
module-name = "pokedex_mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: hits the real PokeAPI and digi-api (deselected by default, run with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py314"
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = ["N818"]  # domain exception names (NotFound, InvalidQuery) are intentional

[tool.pyright]
# Same engine as Pylance: VS Code picks this up, so editor and CLI report the same issues.
include = ["src", "tests"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportDeprecated = "warning"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]
